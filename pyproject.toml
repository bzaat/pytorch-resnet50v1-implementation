[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oxiii_pet"
version = "0.1.0"
description = "ResNet-50 from scratch and transfer learning on the Oxford-IIIT Pet dataset"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core
    "torch>=2.1",
    "torchvision>=0.16",
    "numpy>=1.24",
    # Data
    "pandas>=2.0",
    "Pillow>=9.0",
    "opencv-python==5.0.0.93",
    # Training utilities
    "tqdm>=4.65",
    "tensorboard>=2.14",
    # Metrics and visualization (confusion matrix)
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]
